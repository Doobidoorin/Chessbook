<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chessbook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div id="cover" class="cover">
    <div class="cover-inner">
      <div class="cover-title">𝓒𝓱𝓮𝓼𝓼𝓫𝓸𝓸𝓴</div>
      <div class="cover-subtitle">Note your moves</div>
    </div>
  </div>

  <div id="authModal" class="auth-modal hidden">
    <div class="auth-box">
      <h2 id="authTitle">Sign in</h2>
      <input type="text" id="authUsername" placeholder="Username" autocomplete="username">
      <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
      <div id="authError" class="auth-error"></div>
      <button id="authSubmit">Sign in</button>
      <button id="authToggle" class="auth-link" type="button">Need an account? Create one</button>
    </div>
  </div>

  <div id="book" class="book hidden">
    <div id="stage" class="stage">
      <div id="pageBehind" class="page-leaf page-behind"></div>
      <div id="pageCurrent" class="page-leaf page-current"></div>
      <div id="edgePrev" class="edge edge-prev"></div>
      <div id="edgeNext" class="edge edge-next"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/chess.js@0.13.4/chess.js"></script>
<script src="app.js"></script>
</body>
</html>
